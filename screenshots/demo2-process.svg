<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="935" viewBox="0 0 1920 935">
<rect width="1920" height="935" rx="14" fill="#11151c"/>
<rect width="1920" height="46" rx="14" fill="#1b212b"/>
<circle cx="28" cy="23" r="7" fill="#ff5f57"/><circle cx="52" cy="23" r="7" fill="#febc2e"/><circle cx="76" cy="23" r="7" fill="#28c840"/>
<text x="104" y="30" font-family="monospace" font-size="19" fill="#6b7684">demo2 - running a process</text>
<text x="34" y="76" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#7fb3ff" xml:space="preserve">== Demo 2: running a process ==</text>
<text x="34" y="109" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">command: ls /data /nope</text>
<text x="34" y="142" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve"></text>
<text x="34" y="175" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#7fb3ff" xml:space="preserve">---------- ABL today: INPUT THROUGH ----------</text>
<text x="34" y="208" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#6b7684" xml:space="preserve">-- INPUT THROUGH: stdout and stderr arrive mixed --</text>
<text x="34" y="241" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#ff8a8a" xml:space="preserve">   ls: cannot access &#x27;/nope&#x27;: No such file or directory</text>
<text x="34" y="274" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">   /data:</text>
<text x="34" y="307" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">   in</text>
<text x="34" y="340" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">   readme.txt</text>
<text x="34" y="373" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">   tree</text>
<text x="34" y="406" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">  lines: 5</text>
<text x="34" y="439" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">  OS-ERROR after INPUT THROUGH: 0    &lt;- no exit code anywhere</text>
<text x="34" y="472" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve"></text>
<text x="34" y="505" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#6b7684" xml:space="preserve">-- KB 000145783 workaround: let the shell echo $? --</text>
<text x="34" y="538" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">  exit code recovered from echo $?: 2</text>
<text x="34" y="571" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve"></text>
<text x="34" y="604" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#7fb3ff" xml:space="preserve">---------- .NET: System.Diagnostics.Process ----------</text>
<text x="34" y="637" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#8fd98f" xml:space="preserve">exit code: 2</text>
<text x="34" y="670" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">stdout: </text>
<text x="34" y="703" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">/data:</text>
<text x="34" y="736" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">in</text>
<text x="34" y="769" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">readme.txt</text>
<text x="34" y="802" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">tree</text>
<text x="34" y="835" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#d8dee9" xml:space="preserve">stderr: </text>
<text x="34" y="868" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="23" fill="#ff8a8a" xml:space="preserve">ls: cannot access &#x27;/nope&#x27;: No such file or directory</text>
</svg>